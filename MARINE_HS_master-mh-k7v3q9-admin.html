<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARINE HEALTH SUPPORT MASTER</title>
<style>
:root{--ink:#173042;--muted:#687f89;--line:#c9e1e6;--accent:#0d8394;--card:#fff;--shadow:0 10px 26px rgba(19,72,84,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#eef8fa;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1240px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#0d7182,#18a5b5);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}h1{margin:0 0 6px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.btn{border:0;border-radius:11px;padding:9px 13px;background:#e6f3f5;color:#174b55;font-weight:800}.btn.primary{background:var(--accent);color:#fff}.btn.white{background:#fff}.btn.danger{background:#fff0f0;color:#9b2d2d}.btn.small{padding:6px 9px;font-size:13px}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;margin-top:9px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:800}.tab.active{background:#dff4f7;color:#086b78;border-color:#6fc7d1}
.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.item{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fbfeff;margin:9px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:6px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}input,select,textarea{width:100%;border:1px solid #bcd6dd;border-radius:10px;padding:9px;background:#fff}textarea{min-height:82px;resize:vertical}
.muted{color:var(--muted)}.notice{background:#fff8e9;border:1px solid #efd5a8;border-radius:12px;padding:10px 12px;color:#694914}.ok{background:#edf9f2;border-color:#bce2ca;color:#245d39}
.thumb{width:78px;height:78px;object-fit:contain;border:1px solid var(--line);border-radius:13px;background:#eef8fa}.bgthumb{width:150px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:12px;background:#eef8fa}
.preview{width:100%;height:640px;border:1px solid var(--line);border-radius:15px;background:#fff}.hidden{display:none!important}
@media(max-width:800px){.c8,.c6,.c4,.c3{grid-column:span 12}.preview{height:520px}}
</style></head>
<body><div class="wrap">
<header class="hero"><h1>MARINE TRICK 健康・服薬サポート MASTER</h1><div>公開indexとは別ファイル。ここで編集して公開HTMLを書き出します。</div>
<div class="top"><button class="btn white" onclick="manualSave()">手動保存</button><button class="btn white" onclick="exportJSON()">JSON書き出し</button><label class="btn white">JSON読み込み<input type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></label><button class="btn white" onclick="exportPublic()">公開HTML書き出し</button><button class="btn white" onclick="refreshPreview()">公開プレビュー更新</button></div>
<div class="status" id="saveStatus">未保存</div></header>

<div id="loginGate" class="card" style="margin-top:14px"><h2>管理ログイン</h2><div class="row"><div class="c6"><label>管理パスワード</label><input id="loginPw" type="password" placeholder="パスワード"><div style="margin-top:8px"><button class="btn primary" onclick="login()">ログイン</button></div></div><div class="c6"><div class="notice">管理者専用ページです。設定済みのパスワードを入力してください。</div></div></div></div>

<main id="admin" class="hidden">
<nav class="tabs"><button class="tab active" onclick="tab('basic',this)">基本設定</button><button class="tab" onclick="tab('recordsA',this)">健康記録</button><button class="tab" onclick="tab('sheetsA',this)">シート</button><button class="tab" onclick="tab('checksA',this)">チェック</button><button class="tab" onclick="tab('calendarA',this)">カレンダー</button><button class="tab" onclick="tab('imagesA',this)">画像・背景</button><button class="tab" onclick="tab('calcA',this)">計算</button><button class="tab" onclick="tab('previewA',this)">公開確認</button></nav>
<section id="basic" class="panel active"></section><section id="recordsA" class="panel"></section><section id="sheetsA" class="panel"></section><section id="checksA" class="panel"></section><section id="calendarA" class="panel"></section><section id="imagesA" class="panel"></section><section id="calcA" class="panel"></section><section id="previewA" class="panel"></section>
</main></div>

<script>
const STORAGE='marine_health_support_master_v2',PWKEY='marine_health_support_admin_pw_v2';
const DEFAULT={"title": "MARINE TRICK 健康・服薬サポート", "intro": "記録・シート・計算・セルフチェックをひとつの場所に。", "patientNotice": "入力した情報はこのブラウザ内に保存されます。長期保管が必要な記録は、定期的にバックアップしてください。", "updatedAt": "", "allowImageSave": false, "background": {"name": "", "data": "", "width": 0, "height": 0}, "sectionBackgrounds": {"records": null, "sheets": null, "calc": null, "checks": null}, "loginButton": {"enabled": true, "label": "管理ログイン", "url": "MARINE_HS_master-mh-k7v3q9-admin.html"}, "icons": [], "recordTypes": [{"id": "bp", "name": "血圧", "enabled": true, "fields": [{"key": "sys", "label": "収縮期血圧", "type": "number", "unit": "mmHg"}, {"key": "dia", "label": "拡張期血圧", "type": "number", "unit": "mmHg"}, {"key": "pulse", "label": "脈拍", "type": "number", "unit": "回/分"}, {"key": "memo", "label": "メモ", "type": "text", "unit": ""}]}, {"id": "weight", "name": "体重", "enabled": true, "fields": [{"key": "weight", "label": "体重", "type": "number", "unit": "kg"}]}], "sheets": [{"id": "sheet-bp", "title": "血圧記録シート", "description": "印刷して手書きでも使える記録用シート。", "url": "", "enabled": true}], "calculators": {"bmi": true, "standardWeight": true, "crcl": true, "egfr": true}, "checks": [{"id": "check-dizzy", "title": "ふらつきセルフチェック", "description": "症状や状況を整理するための確認用です。", "iconId": "", "enabled": true, "questions": [{"id": "q1", "text": "立ち上がった時にふらつくことがありますか？"}, {"id": "q2", "text": "最近、転んだり転びそうになったことがありますか？"}, {"id": "q3", "text": "最近、新しく始まった薬や増えた薬がありますか？"}], "resultText": "気になる項目がある場合は、症状の出るタイミングや薬の変更などをメモして、医療機関や薬局で相談してください。"}]};
let data=load(STORAGE,DEFAULT),adminPassword=localStorage.getItem(PWKEY)||'3103',saveTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))} function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):clone(f)}catch(e){return clone(f)}}
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function login(){if(loginPw.value!==adminPassword)return alert('パスワードが違います。');loginGate.classList.add('hidden');admin.classList.remove('hidden');renderAll();}
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='previewA')refreshPreview();}
function markChanged(){saveStatus.textContent='変更あり';if(data.autoSave!==false){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNow('自動保存'),300)}}
function saveNow(label='保存'){data.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE,JSON.stringify(data));saveStatus.textContent=label+'済み: '+new Date().toLocaleTimeString('ja-JP');renderHeaderOnly();return true}catch(e){saveStatus.textContent='端末保存容量を超えました（書き出しは可能）';console.warn('MASTERの端末保存に失敗:',e);return false}}
function manualSave(){saveNow('手動保存')} function renderHeaderOnly(){}
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];markChanged();renderAll();}
function del(arr,i,msg='削除しますか？'){if(confirm(msg)){arr.splice(i,1);markChanged();renderAll();}}
function renderAll(){renderBasic();renderRecords();renderSheets();renderChecks();renderCalendar();renderImages();renderHeaderVisualAdmin();renderCalc();}
function renderBasic(){basic.innerHTML=`<div class="card"><h2>基本設定</h2><div class="row">
<div class="c6"><label>公開タイトル</label><input value="${esc(data.title)}" oninput="data.title=this.value;markChanged()"></div>
<div class="c6"><label>公開画面</label><input value="管理ログインボタンは表示しません" disabled></div>
<div class="c12"><label>説明</label><textarea oninput="data.intro=this.value;markChanged()">${esc(data.intro)}</textarea></div>
<div class="c12"><label>患者向け保存案内</label><textarea oninput="data.patientNotice=this.value;markChanged()">${esc(data.patientNotice)}</textarea></div>
<div class="c3"><label>画像保存許可</label><select onchange="data.allowImageSave=this.value==='true';markChanged()"><option value="true" ${data.allowImageSave?'selected':''}>ON</option><option value="false" ${!data.allowImageSave?'selected':''}>OFF</option></select></div>
<div class="c3"><label>自動保存</label><select onchange="data.autoSave=this.value==='true';markChanged()"><option value="true" ${data.autoSave!==false?'selected':''}>ON</option><option value="false" ${data.autoSave===false?'selected':''}>OFF</option></select></div>
</div><div class="notice" style="margin-top:12px">公開側の「画像保存OFF」は右クリック・ドラッグ等を抑止する機能です。ブラウザ上の画像を完全に複製不能にするものではありません。</div></div>
<div class="card"><h2>管理パスワード</h2><div class="row"><div class="c6"><label>新しいパスワード</label><input id="newPw" type="password"></div><div class="c6"><label>&nbsp;</label><button class="btn primary" onclick="changePw()">変更</button></div></div></div>`}
function changePw(){if(!newPw.value)return alert('新しいパスワードを入力してください。');adminPassword=newPw.value;localStorage.setItem(PWKEY,adminPassword);newPw.value='';alert('管理パスワードを変更しました。')}
function renderRecords(){recordsA.innerHTML=`<div class="card"><div class="head"><h2>健康記録</h2><button class="btn primary" onclick="data.recordTypes.push({id:uid(),name:'新しい記録',enabled:true,fields:[{key:uid(),label:'値',type:'number',unit:''}]});markChanged();renderAll()">＋追加</button></div>${data.recordTypes.map((r,i)=>`<div class="item"><div class="head"><b>${esc(r.name)}</b><div class="actions"><button class="btn small" onclick="move(data.recordTypes,${i},-1)">↑</button><button class="btn small" onclick="move(data.recordTypes,${i},1)">↓</button><button class="btn small danger" onclick="del(data.recordTypes,${i})">削除</button></div></div><div class="row" style="margin-top:8px"><div class="c8"><label>名称</label><input value="${esc(r.name)}" oninput="data.recordTypes[${i}].name=this.value;markChanged()"></div><div class="c4"><label>公開</label><select onchange="data.recordTypes[${i}].enabled=this.value==='true';markChanged()"><option value="true" ${r.enabled?'selected':''}>ON</option><option value="false" ${!r.enabled?'selected':''}>OFF</option></select></div></div><h4>入力項目</h4>${r.fields.map((f,j)=>`<div class="row" style="margin-bottom:7px"><div class="c4"><input value="${esc(f.label)}" oninput="data.recordTypes[${i}].fields[${j}].label=this.value;markChanged()"></div><div class="c4"><input value="${esc(f.unit||'')}" placeholder="単位" oninput="data.recordTypes[${i}].fields[${j}].unit=this.value;markChanged()"></div><div class="c4"><button class="btn small danger" onclick="data.recordTypes[${i}].fields.splice(${j},1);markChanged();renderAll()">項目削除</button></div></div>`).join('')}<button class="btn small" onclick="data.recordTypes[${i}].fields.push({key:uid(),label:'新しい項目',type:'number',unit:''});markChanged();renderAll()">＋入力項目</button></div>`).join('')}</div>`}
function renderSheets(){sheetsA.innerHTML=`<div class="card"><div class="head"><h2>サポートシート</h2><button class="btn primary" onclick="data.sheets.push({id:uid(),title:'新しいシート',description:'',url:'',fileName:'',fileData:'',fileType:'',enabled:true});markChanged();renderAll()">＋追加</button></div><div class="notice">PDFなどのファイル本体を登録できます。公開HTML内へ埋め込むため、大きなファイルほどindex.htmlの容量も増えます。</div>${data.sheets.map((s,i)=>`<div class="item"><div class="head"><b>${esc(s.title)}</b><div class="actions"><button class="btn small" onclick="move(data.sheets,${i},-1)">↑</button><button class="btn small" onclick="move(data.sheets,${i},1)">↓</button><button class="btn small danger" onclick="del(data.sheets,${i})">削除</button></div></div><div class="row"><div class="c8"><label>タイトル</label><input value="${esc(s.title)}" oninput="data.sheets[${i}].title=this.value;markChanged()"></div><div class="c4"><label>公開</label><select onchange="data.sheets[${i}].enabled=this.value==='true';markChanged()"><option value="true" ${s.enabled?'selected':''}>ON</option><option value="false" ${!s.enabled?'selected':''}>OFF</option></select></div><div class="c12"><label>説明</label><textarea oninput="data.sheets[${i}].description=this.value;markChanged()">${esc(s.description)}</textarea></div><div class="c12"><label>外部URL（任意）</label><input value="${esc(s.url||'')}" oninput="data.sheets[${i}].url=this.value;markChanged()"></div><div class="c12"><label>PDF / ファイル本体</label><div class="actions"><label class="btn">${s.fileData?'差し替え':'ファイルを追加'}<input type="file" hidden onchange="setSheetFile(event,${i})"></label>${s.fileData?`<button class="btn danger" onclick="removeSheetFile(${i})">ファイル解除</button><span class="muted">${esc(s.fileName)}（${formatBytes(dataUrlBytes(s.fileData))}）</span>`:''}</div></div></div></div>`).join('')}</div>`}
function dataUrlBytes(v){return v&&v.includes(',')?Math.floor((v.length-v.indexOf(',')-1)*.75):0}function formatBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
async function setSheetFile(e,i){const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>15*1024*1024&&!confirm('このファイルは15MBを超えています。公開HTMLが非常に大きくなりますが登録しますか？'))return;const r=new FileReader();r.onload=()=>{data.sheets[i].fileName=f.name;data.sheets[i].fileType=f.type||'application/octet-stream';data.sheets[i].fileData=r.result;markChanged();renderAll()};r.onerror=()=>alert('ファイルを読み込めませんでした。');r.readAsDataURL(f)}
function removeSheetFile(i){data.sheets[i].fileName='';data.sheets[i].fileType='';data.sheets[i].fileData='';markChanged();renderAll()}
function renderChecks(){checksA.innerHTML=`<div class="card"><div class="head"><h2>セルフチェック</h2><button class="btn primary" onclick="data.checks.push({id:uid(),title:'新しいセルフチェック',description:'',iconId:'',enabled:true,questions:[{id:uid(),text:'新しい質問'}],resultText:'必要に応じて薬局や医療機関に相談してください。'});markChanged();renderAll()">＋追加</button></div>${data.checks.map((c,i)=>`<div class="item"><div class="head"><b>${esc(c.title)}</b><div class="actions"><button class="btn small" onclick="move(data.checks,${i},-1)">↑</button><button class="btn small" onclick="move(data.checks,${i},1)">↓</button><button class="btn small danger" onclick="del(data.checks,${i})">削除</button></div></div><div class="row"><div class="c6"><label>タイトル</label><input value="${esc(c.title)}" oninput="data.checks[${i}].title=this.value;markChanged()"></div><div class="c3"><label>キャラクター</label><select onchange="data.checks[${i}].iconId=this.value;markChanged()"><option value="">なし</option>${data.icons.map(x=>`<option value="${x.id}" ${c.iconId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="c3"><label>公開</label><select onchange="data.checks[${i}].enabled=this.value==='true';markChanged()"><option value="true" ${c.enabled?'selected':''}>ON</option><option value="false" ${!c.enabled?'selected':''}>OFF</option></select></div><div class="c12"><label>説明</label><textarea oninput="data.checks[${i}].description=this.value;markChanged()">${esc(c.description)}</textarea></div><div class="c12"><label>結果・案内文</label><textarea oninput="data.checks[${i}].resultText=this.value;markChanged()">${esc(c.resultText)}</textarea></div></div><h4>質問</h4>${c.questions.map((q,j)=>`<div class="row" style="margin-bottom:7px"><div class="c8"><input value="${esc(q.text)}" oninput="data.checks[${i}].questions[${j}].text=this.value;markChanged()"></div><div class="c4 actions"><button class="btn small" onclick="move(data.checks[${i}].questions,${j},-1)">↑</button><button class="btn small" onclick="move(data.checks[${i}].questions,${j},1)">↓</button><button class="btn small danger" onclick="data.checks[${i}].questions.splice(${j},1);markChanged();renderAll()">削除</button></div></div>`).join('')}<button class="btn small" onclick="data.checks[${i}].questions.push({id:uid(),text:'新しい質問'});markChanged();renderAll()">＋質問</button></div>`).join('')}</div>`}
function renderImages(){imagesA.innerHTML=`<div class="card"><h2>背景同期・個別背景</h2><div class="item"><div class="head"><div><b>全体背景</b><div class="muted">公開index全体に同期</div></div>${data.background?.data?`<img class="bgthumb" src="${data.background.data}">`:''}</div><div class="actions" style="margin-top:8px"><label class="btn">背景登録 / 差し替え<input type="file" accept="image/*" hidden onchange="setImage(event,'global')"></label><button class="btn danger" onclick="data.background={name:'',data:'',width:0,height:0};markChanged();renderAll()">削除</button></div></div>${['records','sheets','calc','checks'].map(k=>`<div class="item"><div class="head"><b>${{records:'健康記録',sheets:'サポートシート',calc:'計算ツール',checks:'セルフチェック'}[k]}</b>${data.sectionBackgrounds?.[k]?.data?`<img class="bgthumb" src="${data.sectionBackgrounds[k].data}">`:''}</div><div class="actions"><label class="btn small">個別背景登録 / 差し替え<input type="file" accept="image/*" hidden onchange="setImage(event,'section','${k}')"></label><button class="btn small danger" onclick="data.sectionBackgrounds['${k}']=null;markChanged();renderAll()">解除</button></div></div>`).join('')}</div>
<div class="card"><div class="head"><h2>キャラクターアイコン</h2><label class="btn primary">＋個別登録<input type="file" accept="image/*" hidden onchange="addIcon(event)"></label></div><div class="notice">アップロード時に指定した長辺サイズへ縮小し、JPEG以外は透過を保てるPNG/WebPで保存できます。</div><div class="row"><div class="c4"><label>最大長辺(px)</label><input id="maxPx" type="number" value="${data.imageOptions?.maxPx||900}"></div><div class="c4"><label>画質(0.1〜1)</label><input id="quality" type="number" min=".1" max="1" step=".05" value="${data.imageOptions?.quality||.85}"></div><div class="c4"><label>形式</label><select id="imgFormat"><option value="image/webp" ${data.imageOptions?.format==='image/webp'?'selected':''}>WebP</option><option value="image/png" ${data.imageOptions?.format==='image/png'?'selected':''}>PNG</option><option value="image/jpeg" ${data.imageOptions?.format==='image/jpeg'?'selected':''}>JPEG</option></select></div></div><button class="btn small" style="margin-top:8px" onclick="saveImageOptions()">圧縮設定を保存</button>${data.icons.map((ic,i)=>`<div class="item"><div class="head"><div style="display:flex;gap:10px;align-items:center"><img class="thumb" src="${ic.data}"><div><input value="${esc(ic.name)}" oninput="data.icons[${i}].name=this.value;markChanged()"><div class="muted">${ic.width||'?'}×${ic.height||'?'} px</div></div></div><div class="actions"><button class="btn small" onclick="move(data.icons,${i},-1)">↑</button><button class="btn small" onclick="move(data.icons,${i},1)">↓</button><label class="btn small">差し替え<input type="file" accept="image/*" hidden onchange="replaceIcon(event,${i})"></label><button class="btn small danger" onclick="removeIcon(${i})">削除</button></div></div></div>`).join('')}</div>`}

rs[${i}].inputs=this.value.split('\\n');markChanged()">${esc((c.inputs||[]).join('\n'))}</textarea></div><div class="c12"><label>計算式（JavaScript数式）</label><input value="${esc(c.expression||'')}" placeholder="例：a/(b/100)**2" oninput="data.customCalculators[${i}].expression=this.value;markChanged()"></div><div class="c12"><label>公開画面に表示する式・説明</label><input value="${esc(c.formulaText||'')}" oninput="data.customCalculators[${i}].formulaText=this.value;markChanged()"></div></div></div>`).join('')}</div>`}
function addCustomCalc(){data.customCalculators=data.customCalculators||[];data.customCalculators.push({id:uid(),title:'新しい計算',inputs:['入力A','入力B'],expression:'a+b',formulaText:'A＋B',unit:'',enabled:true});markChanged();renderAll()}
function addCheckTemplate(type){const base={id:uid(),title:'新しいチェックシート',description:'',iconId:'',enabled:true,type,questions:[],resultText:'必要に応じて薬局や医療機関に相談してください。'};if(type==='scale'){base.title='痛みのスケール';base.scaleLabel='今日の痛み';base.scaleOptions=['😀 0 痛くない','🙂 1','😐 2','😣 3','😭 4 とても痛い']}else{base.questions=[{id:uid(),text:type==='daily'?'今日の体調':'新しい質問'}]}data.checks.push(base);markChanged();renderAll()}

 value="${esc(c.scaleLabel||'今日の状態')}" oninput="data.checks[${i}].scaleLabel=this.value;markChanged()"></div><div class="c12"><label>選択肢（1行1つ・絵文字も変更可）</label><textarea oninput="data.checks[${i}].scaleOptions=this.value.split('\\n');markChanged()">${esc((c.scaleOptions||[]).join('\n'))}</textarea></div>`:`<div class="c12"><h4>質問項目</h4>${(c.questions||[]).map((q,j)=>`<div class="row" style="margin-bottom:7px"><div class="c8"><input value="${esc(q.text)}" oninput="data.checks[${i}].questions[${j}].text=this.value;markChanged()"></div><div class="c4 actions"><button class="btn small" onclick="move(data.checks[${i}].questions,${j},-1)">↑</button><button class="btn small" onclick="move(data.checks[${i}].questions,${j},1)">↓</button><button class="btn small danger" onclick="data.checks[${i}].questions.splice(${j},1);markChanged();renderAll()">削除</button></div></div>`).join('')}<button class="btn small" onclick="data.checks[${i}].questions.push({id:uid(),text:'新しい項目'});markChanged();renderAll()">＋項目</button></div>`}<div class="c12"><label>結果・案内文</label><textarea oninput="data.checks[${i}].resultText=this.value;markChanged()">${esc(c.resultText||'')}</textarea></div></div></div>`).join('')}</div>`}
function renderCalendar(){const c=data.calendar||{enabled:true,intro:'予定を入力してGoogleカレンダーの確認画面を開けます。入力内容はこのサイトに保存されません。',timezone:'Asia/Tokyo',templates:[]};data.calendar=c;calendarA.innerHTML=`<div class="card"><div class="head"><h2>カレンダー追加</h2><button class="btn primary" onclick="data.calendar.templates.push({id:uid(),title:'新しい予定',details:'',duration:30,allDay:false,enabled:true});markChanged();renderAll()">＋予定テンプレート</button></div><div class="notice">公開側で入力した内容は端末内に保存しません。「Googleカレンダーで確認」を押した時だけGoogleの予定作成画面へ渡します。</div><div class="row"><div class="c3"><label>公開</label><select onchange="data.calendar.enabled=this.value==='true';markChanged()"><option value="true" ${c.enabled?'selected':''}>ON</option><option value="false" ${!c.enabled?'selected':''}>OFF</option></select></div><div class="c3"><label>タイムゾーン</label><input value="${esc(c.timezone||'Asia/Tokyo')}" oninput="data.calendar.timezone=this.value;markChanged()"></div><div class="c6"><label>公開画面の説明</label><input value="${esc(c.intro||'')}" oninput="data.calendar.intro=this.value;markChanged()"></div></div>${c.templates.map((t,i)=>`<div class="item"><div class="head"><b>${esc(t.title)}</b><div class="actions"><button class="btn small" onclick="move(data.calendar.templates,${i},-1)">↑</button><button class="btn small" onclick="move(data.calendar.templates,${i},1)">↓</button><button class="btn small danger" onclick="del(data.calendar.templates,${i})">削除</button></div></div><div class="row"><div class="c6"><label>初期予定名</label><input value="${esc(t.title)}" oninput="data.calendar.templates[${i}].title=this.value;markChanged()"></div><div class="c3"><label>公開</label><select onchange="data.calendar.templates[${i}].enabled=this.value==='true';markChanged()"><option value="true" ${t.enabled?'selected':''}>ON</option><option value="false" ${!t.enabled?'selected':''}>OFF</option></select></div><div class="c3"><label>終日予定</label><select onchange="data.calendar.templates[${i}].allDay=this.value==='true';markChanged()"><option value="false" ${!t.allDay?'selected':''}>時刻指定</option><option value="true" ${t.allDay?'selected':''}>終日</option></select></div><div class="c8"><label>初期説明・メモ</label><input value="${esc(t.details||'')}" oninput="data.calendar.templates[${i}].details=this.value;markChanged()"></div><div class="c4"><label>所要時間（分）</label><input type="number" min="5" step="5" value="${Number(t.duration)||30}" oninput="data.calendar.templates[${i}].duration=Math.max(5,Number(this.value)||30);markChanged()"></div></div></div>`).join('')}</div>`}
function renderHeaderVisualAdmin(){const h=data.headerVisual||(data.headerVisual={iconId:'',icon:null,banner:null});imagesA.insertAdjacentHTML('afterbegin',`<div class="card"><h2>タイトルまわりの画像</h2><div class="notice">正方形アイコンは題名の横、横長画像は題名エリアの下に表示されます。専用画像を登録するか、既存キャラクターアイコンを選べます。</div><div class="item"><div class="head"><div><b>タイトルアイコン</b>${h.icon?.data?`<img class="thumb" src="${h.icon.data}">`:''}</div><div class="actions"><select onchange="data.headerVisual.iconId=this.value;markChanged()"><option value="">既存アイコンを使わない</option>${data.icons.map(x=>`<option value="${x.id}" ${h.iconId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label class="btn small">専用画像を登録／差し替え<input type="file" hidden accept="image/*" onchange="setHeaderVisual(event,'icon')"></label><button class="btn small danger" onclick="data.headerVisual.icon=null;data.headerVisual.iconId='';markChanged();renderAll()">解除</button></div></div></div><div class="item"><div class="head"><div><b>横長の見出し画像</b>${h.banner?.data?`<img class="bgthumb" src="${h.banner.data}">`:''}</div><div class="actions"><label class="btn small">画像を登録／差し替え<input type="file" hidden accept="image/*" onchange="setHeaderVisual(event,'banner')"></label><button class="btn small danger" onclick="data.headerVisual.banner=null;markChanged();renderAll()">解除</button></div></div></div></div>`)}
async function setHeaderVisual(e,key){const f=e.target.files[0];e.target.value='';if(!f)return;data.headerVisual=data.headerVisual||{iconId:'',icon:null,banner:null};data.headerVisual[key]=await compress(f);if(key==='icon')data.headerVisual.iconId='';markChanged();renderAll()}
function saveImageOptions(){data.imageOptions={maxPx:+maxPx.value||900,quality:+quality.value||.85,format:imgFormat.value};markChanged();}
async function compress(file){const opt=data.imageOptions||{maxPx:900,quality:.85,format:'image/webp'};const src=await fileToData(file);const im=await imgLoad(src);let w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,(opt.maxPx||900)/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(opt.format==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);return {name:file.name,data:c.toDataURL(opt.format||'image/webp',opt.quality||.85),width:w,height:h}}
function fileToData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})} function imgLoad(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function setImage(e,type,key){const f=e.target.files[0];e.target.value='';if(!f)return;const o=await compress(f);if(type==='global')data.background=o;else data.sectionBackgrounds[key]=o;markChanged();renderAll()}
async function addIcon(e){const f=e.target.files[0];e.target.value='';if(!f)return;const o=await compress(f);o.id=uid();o.name=f.name.replace(/\.[^.]+$/,'');data.icons.push(o);markChanged();renderAll()}
async function replaceIcon(e,i){const f=e.target.files[0];e.target.value='';if(!f)return;const old=data.icons[i],o=await compress(f);o.id=old.id;o.name=old.name;data.icons[i]=o;markChanged();renderAll()}
function removeIcon(i){if(!confirm('このアイコンを削除しますか？'))return;const id=data.icons[i].id;data.icons.splice(i,1);data.checks.forEach(c=>{if(c.iconId===id)c.iconId=''});markChanged();renderAll()}
function exportJSON(){const o={format:'MARINE_TRICK_HEALTH_SUPPORT_MASTER',version:2,exportedAt:new Date().toISOString(),data};download('MARINE_HEALTH_SUPPORT_MASTER_backup.json',JSON.stringify(o,null,2),'application/json')}
async function importJSON(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text()),d=o.data||o;if(!d.recordTypes||!d.checks)throw 0;if(confirm('現在のMASTER内容を置き換えますか？')){data=d;saveNow('JSON読込');renderAll();}}catch(err){alert('このJSONは読み込めませんでした。')}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function bandRows(arr,path){return (arr||[]).map((b,j)=>`<div class="row" style="margin:7px 0"><div class="c3"><input type="number" step="any" placeholder="下限（空欄可）" value="${b.min??''}" oninput="${path}[${j}].min=this.value===''?null:Number(this.value);markChanged()"></div><div class="c3"><input type="number" step="any" placeholder="上限（空欄可）" value="${b.max??''}" oninput="${path}[${j}].max=this.value===''?null:Number(this.value);markChanged()"></div><div class="c3"><input placeholder="判定名" value="${esc(b.label||'')}" oninput="${path}[${j}].label=this.value;markChanged()"></div><div class="c3 actions"><input placeholder="案内文" value="${esc(b.message||'')}" oninput="${path}[${j}].message=this.value;markChanged()"><button class="btn small danger" onclick="${path}.splice(${j},1);markChanged();renderAll()">削除</button></div></div>`).join('')}
function renderCalc(){const defs={bmi:['BMI','体重(kg) ÷ {身長(m)}²'],standardWeight:['標準体重','22 × {身長(m)}²'],crcl:['クレアチニンクリアランス（Cockcroft-Gault）','男性：(140－年齢) × 体重 ÷ {72 × 血清Cr}／女性：男性値 × 0.85'],egfr:['eGFR（日本人成人・血清Cr）','男性：194 × 血清Cr^-1.094 × 年齢^-0.287／女性：男性値 × 0.739']};data.calcGuidance=data.calcGuidance||{};data.customCalculators=data.customCalculators||[];calcA.innerHTML=`<div class="card"><div class="head"><h2>計算ツール・判定設定</h2><button class="btn primary" onclick="addCustomCalc()">＋計算式を追加</button></div><div class="notice">下限以上・上限未満で判定します。標準値や注意区分は対象者・指針で変わるため、公開前に内容を確認してください。ポップアップONでは計算直後に判定と案内文も表示します。</div>${Object.entries(defs).map(([k,v])=>{const g=data.calcGuidance[k]||(data.calcGuidance[k]={bands:[],popup:false});return `<div class="item"><div class="head"><div><b>${v[0]}</b><div class="muted">式：${v[1]}</div></div><div class="actions"><select onchange="data.calculators['${k}']=this.value==='true';markChanged()"><option value="true" ${data.calculators[k]?'selected':''}>公開ON</option><option value="false" ${!data.calculators[k]?'selected':''}>OFF</option></select><label><input style="width:auto" type="checkbox" ${g.popup?'checked':''} onchange="data.calcGuidance['${k}'].popup=this.checked;markChanged()"> 判定ポップアップ</label></div></div><h4>結果の判定範囲</h4>${bandRows(g.bands,`data.calcGuidance['${k}'].bands`)}<button class="btn small" onclick="data.calcGuidance['${k}'].bands.push({min:null,max:null,label:'注意度',message:''});markChanged();renderAll()">＋判定範囲</button></div>`}).join('')}${data.customCalculators.map((c,i)=>{c.bands=c.bands||[];return `<div class="item"><div class="head"><b>${esc(c.title)}</b><div class="actions"><button class="btn small" onclick="move(data.customCalculators,${i},-1)">↑</button><button class="btn small" onclick="move(data.customCalculators,${i},1)">↓</button><button class="btn small danger" onclick="del(data.customCalculators,${i})">削除</button></div></div><div class="row"><div class="c6"><label>名称</label><input value="${esc(c.title)}" oninput="data.customCalculators[${i}].title=this.value;markChanged()"></div><div class="c3"><label>結果の単位</label><input value="${esc(c.unit||'')}" oninput="data.customCalculators[${i}].unit=this.value;markChanged()"></div><div class="c3"><label>公開</label><select onchange="data.customCalculators[${i}].enabled=this.value==='true';markChanged()"><option value="true" ${c.enabled?'selected':''}>ON</option><option value="false" ${!c.enabled?'selected':''}>OFF</option></select></div><div class="c12"><label>入力項目（1行1項目。上から a、b、c…）</label><textarea oninput="data.customCalculators[${i}].inputs=this.value.split('\\n');markChanged()">${esc((c.inputs||[]).join('\n'))}</textarea></div><div class="c12"><label>計算式</label><input value="${esc(c.expression||'')}" oninput="data.customCalculators[${i}].expression=this.value;markChanged()"></div><div class="c8"><label>公開する式・説明</label><input value="${esc(c.formulaText||'')}" oninput="data.customCalculators[${i}].formulaText=this.value;markChanged()"></div><div class="c4"><label><input style="width:auto" type="checkbox" ${c.popup?'checked':''} onchange="data.customCalculators[${i}].popup=this.checked;markChanged()"> 判定ポップアップ</label></div></div><h4>結果の判定範囲</h4>${bandRows(c.bands,`data.customCalculators[${i}].bands`)}<button class="btn small" onclick="data.customCalculators[${i}].bands.push({min:null,max:null,label:'注意度',message:''});markChanged();renderAll()">＋判定範囲</button></div>`}).join('')}</div>`}
function publicHtml(){const cfg=clone(data);cfg.updatedAt=new Date().toISOString();const css="\n:root{--ink:#173042;--muted:#667f8a;--line:#cfe4e9;--accent:#0d8394;--card:rgba(255,255,255,.94);--shadow:0 10px 28px rgba(17,72,85,.11)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Yu Gothic\",Meiryo,sans-serif;color:var(--ink);background:#edf8fa;background-size:cover;background-position:center;background-attachment:fixed}\nbutton,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:14px}\n.hero{background:linear-gradient(135deg,rgba(9,116,132,.95),rgba(23,169,184,.92));color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}\n.hero h1{margin:0 0 7px;font-size:clamp(25px,5vw,38px)}.hero .sub{opacity:.92}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}\n.btn{border:0;border-radius:12px;padding:10px 14px;background:#e7f4f6;color:#174b55;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}\n.btn.primary{background:var(--accent);color:#fff}.btn.white{background:#fff;color:#0d6875}.btn.danger{background:#fff0f0;color:#9c3131}.btn.small{padding:7px 10px;font-size:13px}\n.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.tab{border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:15px;padding:13px 7px;font-weight:900}.tab.active{background:#dff5f7;border-color:#74c7d1;color:#0b6976}\n.section{display:none}.section.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);background-size:cover;background-position:center}.card h2,.card h3{margin-top:0}\n.notice{background:#fff8e9;border:1px solid #efd5a4;color:#694814;border-radius:13px;padding:11px 13px;margin:11px 0}.muted{color:var(--muted)}\n.item{background:rgba(251,254,255,.95);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.item-title{font-weight:900}\n.row{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}\nlabel{display:block;font-size:13px;font-weight:800;margin-bottom:5px;color:#31525d}input,select,textarea{width:100%;border:1px solid #bad6dd;border-radius:11px;padding:9px 10px;background:#fbfeff;color:var(--ink)}\n.scroll{overflow:auto}.records{width:100%;border-collapse:collapse;font-size:14px}.records th,.records td{padding:8px 6px;border-bottom:1px solid #e1edf0;text-align:left;white-space:nowrap}\n.check-wrap{display:flex;gap:13px;align-items:flex-start}.char-icon{width:62px;height:62px;object-fit:contain;border-radius:15px;background:#eef8fa;border:1px solid var(--line);flex:0 0 auto}.question{padding:11px 0;border-top:1px solid #e1edf0}.question:first-child{border-top:0}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice label{font-weight:600;background:#eef7f9;border:1px solid #cce3e8;padding:7px 10px;border-radius:999px}.choice input{width:auto}\n.result{margin-top:10px;padding:11px;border-radius:13px;background:#eef9fa;border:1px solid #c6e4e8}.hidden{display:none!important}.footer{text-align:center;color:#6b8189;font-size:12px;padding:24px 0 35px}\n@media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.c6,.c4,.c3{grid-column:span 12}.wrap{padding:9px}.hero{border-radius:18px}.card{border-radius:16px;padding:13px}}\n@media print{body{background:white!important}.no-print,.tabs{display:none!important}.section{display:block!important}.card{box-shadow:none;border:1px solid #bbb;background:white!important;break-inside:avoid}}\n";let js="\nconst CONFIG = __CONFIG__;\nconst PATIENT_KEY='marine_health_support_patient_v2';\nlet patient=load(PATIENT_KEY,{records:{},checks:{}});\nfunction load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(f))}catch(e){return JSON.parse(JSON.stringify(f))}}\nfunction savePatient(){localStorage.setItem(PATIENT_KEY,JSON.stringify(patient))}\nfunction esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]))}\nfunction uid(){return 'p'+Math.random().toString(36).slice(2)+Date.now().toString(36)}\nfunction localDT(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}\nfunction fmt(v){try{return new Date(v).toLocaleString('ja-JP')}catch(e){return v||''}}\nfunction dl(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}\nfunction switchTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}\nfunction icon(id){return CONFIG.icons.find(x=>x.id===id)}\nfunction bgStyle(key){const b=CONFIG.sectionBackgrounds?.[key];return b?.data?`style=\"background-image:linear-gradient(rgba(255,255,255,.90),rgba(255,255,255,.90)),url('${b.data}')\"`:''}\nfunction render(){\n document.title=CONFIG.title+' | MARINE TRICK';\n document.getElementById('title').textContent=CONFIG.title;document.getElementById('intro').textContent=CONFIG.intro;\n document.getElementById('updated').textContent=CONFIG.updatedAt?('\u6700\u7d42\u66f4\u65b0: '+fmt(CONFIG.updatedAt)):'';\n if(CONFIG.background?.data)document.body.style.backgroundImage=`linear-gradient(rgba(237,248,250,.82),rgba(237,248,250,.82)),url(\"${CONFIG.background.data}\")`;\n const login=document.getElementById('loginBtn'); if(CONFIG.loginButton?.enabled){login.classList.remove('hidden');login.href=CONFIG.loginButton.url||'#'}else login.classList.add('hidden');\n records.innerHTML=`<div class=\"card\" ${bgStyle('records')}><h2>\u5065\u5eb7\u8a18\u9332</h2><div class=\"notice\">${esc(CONFIG.patientNotice)}</div>${CONFIG.recordTypes.filter(x=>x.enabled).map(recordBlock).join('')||'<p class=\"muted\">\u516c\u958b\u4e2d\u306e\u8a18\u9332\u9805\u76ee\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p>'}</div>`;\n sheets.innerHTML=`<div class=\"card\" ${bgStyle('sheets')}><h2>\u30b5\u30dd\u30fc\u30c8\u30b7\u30fc\u30c8</h2><p class=\"muted\">\u8a18\u9332\u30fb\u78ba\u8a8d\u30fb\u5370\u5237\u306b\u4f7f\u3048\u308b\u30b7\u30fc\u30c8\u3067\u3059\u3002</p>${CONFIG.sheets.filter(x=>x.enabled).map(s=>`<div class=\"item\"><div class=\"item-head\"><div><div class=\"item-title\">${esc(s.title)}</div><div class=\"muted\">${esc(s.description)}</div></div>${s.url?`<a class=\"btn primary\" href=\"${esc(s.url)}\" target=\"_blank\" rel=\"noopener\">\u958b\u304f / \u30c0\u30a6\u30f3\u30ed\u30fc\u30c9</a>`:'<span class=\"muted\">\u6e96\u5099\u4e2d</span>'}</div></div>`).join('')||'<p class=\"muted\">\u516c\u958b\u4e2d\u306e\u30b7\u30fc\u30c8\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p>'}</div>`;\n calc.innerHTML=`<div class=\"card\" ${bgStyle('calc')}><h2>\u5065\u5eb7\u8a08\u7b97\u30c4\u30fc\u30eb</h2><div class=\"notice\">\u8a08\u7b97\u7d50\u679c\u306f\u76ee\u5b89\u3067\u3059\u3002\u8a3a\u65ad\u3084\u6cbb\u7642\u5224\u65ad\u306e\u4ee3\u308f\u308a\u306b\u306f\u306a\u308a\u307e\u305b\u3093\u3002</div>${calcBlocks()}</div>`;\n checks.innerHTML=`<div class=\"card\" ${bgStyle('checks')}><h2>\u30bb\u30eb\u30d5\u30c1\u30a7\u30c3\u30af</h2><div class=\"notice\">\u72b6\u614b\u6574\u7406\u306e\u305f\u3081\u306e\u88dc\u52a9\u30c4\u30fc\u30eb\u3067\u3059\u3002\u8a3a\u65ad\u3092\u884c\u3046\u3082\u306e\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002</div>${CONFIG.checks.filter(x=>x.enabled).map(checkBlock).join('')||'<p class=\"muted\">\u516c\u958b\u4e2d\u306e\u30bb\u30eb\u30d5\u30c1\u30a7\u30c3\u30af\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p>'}</div>`;\n protectImages();\n}\nfunction recordBlock(rt){\n const arr=(patient.records[rt.id]||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));\n return `<div class=\"item\"><div class=\"item-head\"><div class=\"item-title\">${esc(rt.name)}</div><div class=\"muted\">${arr.length}\u4ef6</div></div><div class=\"row\" style=\"margin-top:9px\"><div class=\"c4\"><label>\u65e5\u6642</label><input id=\"at_${rt.id}\" type=\"datetime-local\" value=\"${localDT()}\"></div>${rt.fields.map(f=>`<div class=\"c4\"><label>${esc(f.label)}${f.unit?' ('+esc(f.unit)+')':''}</label><input id=\"f_${rt.id}_${f.key}\" type=\"${f.type||'number'}\" inputmode=\"${f.type==='number'?'decimal':'text'}\"></div>`).join('')}</div><div style=\"margin-top:9px\"><button class=\"btn primary\" onclick=\"addRecord('${rt.id}')\">\u8a18\u9332\u3059\u308b</button></div>${arr.length?`<div class=\"scroll\" style=\"margin-top:10px\"><table class=\"records\"><thead><tr><th>\u65e5\u6642</th>${rt.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>${arr.slice(0,40).map(r=>`<tr><td>${esc(fmt(r.at))}</td>${rt.fields.map(f=>`<td>${esc(r.values?.[f.key]??'')} ${esc(f.unit||'')}</td>`).join('')}<td><button class=\"btn small danger\" onclick=\"delRecord('${rt.id}','${r.id}')\">\u524a\u9664</button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`\n}\nfunction addRecord(id){const rt=CONFIG.recordTypes.find(x=>x.id===id);if(!rt)return;const values={};let ok=false;rt.fields.forEach(f=>{const v=document.getElementById(`f_${id}_${f.key}`).value.trim();values[f.key]=v;if(v)ok=true});if(!ok)return alert('\u5c11\u306a\u304f\u3068\u30821\u9805\u76ee\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u3002');patient.records[id]=patient.records[id]||[];patient.records[id].push({id:uid(),at:document.getElementById(`at_${id}`).value||new Date().toISOString(),values});savePatient();render()}\nfunction delRecord(t,id){if(!confirm('\u3053\u306e\u8a18\u9332\u3092\u524a\u9664\u3057\u307e\u3059\u304b\uff1f'))return;patient.records[t]=(patient.records[t]||[]).filter(x=>x.id!==id);savePatient();render()}\nfunction calcBlocks(){let h='';const c=CONFIG.calculators||{};if(c.bmi)h+=`<div class=\"item\"><h3>BMI</h3><div class=\"row\"><div class=\"c4\"><label>\u8eab\u9577(cm)</label><input id=\"bH\" type=\"number\"></div><div class=\"c4\"><label>\u4f53\u91cd(kg)</label><input id=\"bW\" type=\"number\"></div><div class=\"c4\"><label>\u7d50\u679c</label><input id=\"bR\" readonly></div></div><button class=\"btn primary\" onclick=\"let h=+bH.value/100,w=+bW.value;bR.value=h>0&&w>0?(w/h/h).toFixed(1):''\">\u8a08\u7b97</button></div>`;\n if(c.standardWeight)h+=`<div class=\"item\"><h3>\u6a19\u6e96\u4f53\u91cd\uff08BMI 22\uff09</h3><div class=\"row\"><div class=\"c6\"><label>\u8eab\u9577(cm)</label><input id=\"sH\" type=\"number\"></div><div class=\"c6\"><label>\u6a19\u6e96\u4f53\u91cd(kg)</label><input id=\"sR\" readonly></div></div><button class=\"btn primary\" onclick=\"let h=+sH.value/100;sR.value=h>0?(22*h*h).toFixed(1):''\">\u8a08\u7b97</button></div>`;\n if(c.crcl)h+=`<div class=\"item\"><h3>\u30af\u30ec\u30a2\u30c1\u30cb\u30f3\u30af\u30ea\u30a2\u30e9\u30f3\u30b9\uff08Cockcroft-Gault\uff09</h3><div class=\"row\"><div class=\"c3\"><label>\u5e74\u9f62</label><input id=\"cA\" type=\"number\"></div><div class=\"c3\"><label>\u4f53\u91cd(kg)</label><input id=\"cW\" type=\"number\"></div><div class=\"c3\"><label>Scr(mg/dL)</label><input id=\"cS\" type=\"number\" step=\".01\"></div><div class=\"c3\"><label>\u6027\u5225</label><select id=\"cX\"><option value=\"m\">\u7537\u6027</option><option value=\"f\">\u5973\u6027</option></select></div></div><button class=\"btn primary\" onclick=\"crcl()\">\u8a08\u7b97</button><div id=\"cR\" class=\"result hidden\"></div></div>`;\n if(c.egfr)h+=`<div class=\"item\"><h3>eGFR\uff08\u65e5\u672c\u4eba\u6210\u4eba\u30fb\u8840\u6e05Cr\uff09</h3><div class=\"row\"><div class=\"c4\"><label>\u5e74\u9f62</label><input id=\"eA\" type=\"number\"></div><div class=\"c4\"><label>Scr(mg/dL)</label><input id=\"eS\" type=\"number\" step=\".01\"></div><div class=\"c4\"><label>\u6027\u5225</label><select id=\"eX\"><option value=\"m\">\u7537\u6027</option><option value=\"f\">\u5973\u6027</option></select></div></div><button class=\"btn primary\" onclick=\"egfr()\">\u8a08\u7b97</button><div id=\"eR\" class=\"result hidden\"></div></div>`;return h||'<p class=\"muted\">\u516c\u958b\u4e2d\u306e\u8a08\u7b97\u30c4\u30fc\u30eb\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p>'}\nfunction crcl(){let a=+cA.value,w=+cW.value,s=+cS.value;if(!(a>0&&w>0&&s>0))return;let r=(140-a)*w/(72*s);if(cX.value==='f')r*=.85;cR.textContent='\u63a8\u7b97CrCl: '+r.toFixed(1)+' mL/min';cR.classList.remove('hidden')}\nfunction egfr(){let a=+eA.value,s=+eS.value;if(!(a>0&&s>0))return;let r=194*Math.pow(s,-1.094)*Math.pow(a,-.287);if(eX.value==='f')r*=.739;eR.textContent='\u63a8\u7b97eGFR: '+r.toFixed(1)+' mL/min/1.73m\u00b2';eR.classList.remove('hidden')}\nfunction checkBlock(c){const ic=icon(c.iconId),sv=patient.checks[c.id]||{};return `<div class=\"item check-wrap\">${ic?.data?`<img class=\"char-icon protected-image\" src=\"${ic.data}\" alt=\"${esc(ic.name)}\">`:''}<div style=\"flex:1\"><h3>${esc(c.title)}</h3><div class=\"muted\">${esc(c.description)}</div>${c.questions.map((q,i)=>`<div class=\"question\"><b>${i+1}. ${esc(q.text)}</b><div class=\"choice\" style=\"margin-top:7px\"><label><input type=\"radio\" name=\"q_${c.id}_${q.id}\" value=\"yes\" ${sv.answers?.[q.id]==='yes'?'checked':''}> \u306f\u3044</label><label><input type=\"radio\" name=\"q_${c.id}_${q.id}\" value=\"no\" ${sv.answers?.[q.id]==='no'?'checked':''}> \u3044\u3044\u3048</label></div></div>`).join('')}<button class=\"btn primary\" onclick=\"saveCheck('${c.id}')\">\u7d50\u679c\u3092\u4fdd\u5b58</button><div class=\"result ${sv.savedAt?'':'hidden'}\">${sv.savedAt?`\u300c\u306f\u3044\u300d${sv.yes||0}\u9805\u76ee / ${c.questions.length}\u9805\u76ee\u3000\u6700\u7d42\u4fdd\u5b58: ${esc(fmt(sv.savedAt))}<br>${esc(c.resultText)}`:''}</div></div></div>`}\nfunction saveCheck(id){const c=CONFIG.checks.find(x=>x.id===id);const answers={};let n=0,y=0;c.questions.forEach(q=>{const el=document.querySelector(`input[name=\"q_${id}_${q.id}\"]:checked`);if(el){answers[q.id]=el.value;n++;if(el.value==='yes')y++}});if(n<c.questions.length&&!confirm('\u672a\u56de\u7b54\u304c\u3042\u308a\u307e\u3059\u3002\u3053\u306e\u307e\u307e\u4fdd\u5b58\u3057\u307e\u3059\u304b\uff1f'))return;patient.checks[id]={answers,yes:y,savedAt:new Date().toISOString()};savePatient();render()}\nfunction backup(){dl('marine-health-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'MARINE_TRICK_HEALTH_PATIENT_BACKUP',version:2,exportedAt:new Date().toISOString(),patient},null,2))}\nasync function restore(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text()),d=o.patient||o;if(!d.records||!d.checks)throw 0;if(confirm('\u3053\u306e\u7aef\u672b\u306e\u73fe\u5728\u306e\u8a18\u9332\u3092\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u5185\u5bb9\u3067\u7f6e\u304d\u63db\u3048\u307e\u3059\u304b\uff1f')){patient=d;savePatient();render();alert('\u5fa9\u5143\u3057\u307e\u3057\u305f\u3002')}}catch(err){alert('\u3053\u306e\u30d0\u30c3\u30af\u30a2\u30c3\u30d7JSON\u306f\u8aad\u307f\u8fbc\u3081\u307e\u305b\u3093\u3067\u3057\u305f\u3002')}}\nfunction protectImages(){if(CONFIG.allowImageSave)return;document.querySelectorAll('.protected-image').forEach(img=>{img.draggable=false;img.addEventListener('contextmenu',e=>e.preventDefault())})}\nrender();\n".replace('__CONFIG__',JSON.stringify(cfg));return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>${esc(cfg.title)}</title><style>${css}</style></head><body><div class="wrap"><header class="hero"><h1 id="title"></h1><div class="sub" id="intro"></div><div class="hero-actions  window.editCheckEntry=function(id,savedAt){const c=CONFIG.checks.find(x=>x.id===id),arr=Array.isArray(patient.checks[id])?patient.checks[id]:[],x=arr.find(v=>v.savedAt===savedAt);if(!c||!x)return;const date=prompt('日付を変更してください（例：2026-09-14）',String(x.savedAt||'').slice(0,10));if(date===null)return;if(/^\d{4}-\d{2}-\d{2}$/.test(date))x.savedAt=date+'T12:00:00';if(c.type==='scale'){const choices=(c.scaleOptions||[]).map((o,i)=>i+': '+o).join('\n');const v=prompt('番号を入力してください\n'+choices,String(x.scale??0));if(v!==null&&Number.isInteger(Number(v))&&c.scaleOptions[Number(v)]!==undefined){x.scale=Number(v);x.scaleText=c.scaleOptions[x.scale]}}else{for(const q of c.questions||[]){const now=x.answers?.[q.id]==='yes'?'はい':x.answers?.[q.id]==='no'?'いいえ':'';const v=prompt(q.text+'（はい／いいえ）',now);if(v!==null){x.answers=x.answers||{};if(v==='はい'||v.toLowerCase()==='yes')x.answers[q.id]='yes';else if(v==='いいえ'||v.toLowerCase()==='no')x.answers[q.id]='no'}}}savePatient();render()};
 function applyAdvanced(){const target=document.querySelector('#checks .card');if(!target)return;target.innerHTML='<h2>チェックシート</h2><div class="notice">状態整理のための補助ツールです。診断を行うものではありません。</div>'+CONFIG.checks.filter(x=>x.enabled).map(advancedBlock).join('');protectImages()};const originalRender=render;render=function(){originalRender();applyAdvanced();decorateRecords()};applyAdvanced();decorateRecords();
}
function enhancedPublicHtml(){const oldLogin=data.loginButton?.enabled;if(data.loginButton)data.loginButton.enabled=false;let html;try{html=publicHtml()}finally{if(data.loginButton)data.loginButton.enabled=oldLogin}const addon='('+publicEnhancer.toString()+')();';return html.replace('</body>','<scr'+'ipt>'+addon+'</scr'+'ipt></body>')}
function exportPublic(){try{data.updatedAt=new Date().toISOString();const html=enhancedPublicHtml();const saved=saveNow('公開書出し');download('index.html',html,'text/html;charset=utf-8');if(!saved)setTimeout(()=>alert('PDFなどで端末の保存容量を超えていますが、公開用index.htmlの書き出しは実行しました。MASTER内容はJSONでもバックアップしてください。'),100)}catch(e){console.error(e);alert('公開HTMLを作成できませんでした。添付ファイルが大きすぎる可能性があります。PDFを小さくしてから再度お試しください。')}}
function refreshPreview(){previewA.innerHTML=`<div class="card"><div class="head"><h2>公開側プレビュー / ログインボタン動作確認</h2><div class="actions"><button class="btn" onclick="testLoginButton()">ログインボタン確認</button><button class="btn" onclick="refreshPreview()">再読込</button></div></div><div id="loginTest" class="notice ok">公開側の設定URL: ${esc(data.loginButton.url||'(未設定)')}</div><iframe id="pv" class="preview"></iframe></div>`;setTimeout(()=>{const d=pv.contentDocument;d.open();d.write(enhancedPublicHtml());d.close()},20)}
function testLoginButton(){const u=data.loginButton?.url||'';if(!data.loginButton?.enabled)return loginTest.textContent='公開側ログインボタンは非表示設定です。';if(!u)return loginTest.textContent='ログインボタンURLが未設定です。';loginTest.innerHTML='ログインボタンは表示ON。リンク先: <b>'+esc(u)+'</b><br>GitHub公開時はMASTERファイル名/配置とURLが一致しているか確認してください。';}
if(data.autoSave===undefined)data.autoSave=true;if(!data.imageOptions)data.imageOptions={maxPx:900,quality:.85,format:'image/webp'};if(!data.sectionBackgrounds)data.sectionBackgrounds={records:null,sheets:null,calc:null,checks:null};if(!data.customCalculators)data.customCalculators=[];data.sheets.forEach(s=>{s.fileName=s.fileName||'';s.fileType=s.fileType||'';s.fileData=s.fileData||''});data.checks.forEach(c=>{c.type=c.type||'self'});if(!data.checks.some(c=>c.id==='check-pain-scale'))data.checks.push({id:'check-pain-scale',title:'痛みのスケール',description:'今日の痛みを選んで記録できます。',iconId:'',enabled:true,type:'scale',scaleLabel:'今日の痛み',scaleOptions:['😀 0 痛くない','🙂 1 少し痛い','😐 2 痛い','😣 3 かなり痛い','😭 4 とても痛い'],questions:[],resultText:''});if(!data.checks.some(c=>c.id==='check-daily-health'))data.checks.push({id:'check-daily-health',title:'毎日の体調チェック',description:'日ごとの体調を記録できます。',iconId:'',enabled:true,type:'daily',questions:[{id:'daily-q1',text:'今日、体調で気になることがありますか？'},{id:'daily-q2',text:'薬について困ったことがありますか？'}],resultText:'気になることが続く場合は、薬局や医療機関へ相談してください。'});
data.calcGuidance=data.calcGuidance||{};['bmi','standardWeight','crcl','egfr'].forEach(k=>{data.calcGuidance[k]=data.calcGuidance[k]||{bands:[],popup:false}});if(!data.featuresV3){data.calcGuidance.bmi.bands=[{min:null,max:18.5,label:'標準範囲より低め',message:'体重変化や体調も合わせて確認してください。'},{min:18.5,max:25,label:'一般的な標準範囲',message:'結果は目安です。'},{min:25,max:30,label:'標準範囲より高め',message:'生活習慣や経過を確認しましょう。'},{min:30,max:null,label:'注意が必要な範囲',message:'必要に応じて医療機関へ相談してください。'}];data.customCalculators.push({id:'calc-standard-deviation',title:'標準体重からの差',inputs:['現在の体重(kg)','身長(cm)'],expression:'(a-(22*(b/100)**2))/(22*(b/100)**2)*100',formulaText:'{現在体重－標準体重} ÷ 標準体重 × 100',unit:'%',enabled:true,popup:false,bands:[{min:null,max:-10,label:'標準体重より10%以上低い',message:'体重変化や体調も合わせて確認してください。'},{min:-10,max:10,label:'標準体重との差が±10%以内',message:'結果は目安です。'},{min:10,max:null,label:'標準体重より10%以上高い',message:'生活習慣や経過も確認してください。'}]});data.featuresV3=true}
