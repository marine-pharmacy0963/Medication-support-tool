<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARINE TRICK 健康・服薬サポート</title><style>
:root{--ink:#173042;--muted:#667f8a;--line:#cfe4e9;--accent:#0d8394;--card:rgba(255,255,255,.94);--shadow:0 10px 28px rgba(17,72,85,.11)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#edf8fa;background-size:cover;background-position:center;background-attachment:fixed}
button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,rgba(9,116,132,.95),rgba(23,169,184,.92));color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{margin:0 0 7px;font-size:clamp(25px,5vw,38px)}.hero .sub{opacity:.92}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:#e7f4f6;color:#174b55;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:#fff}.btn.white{background:#fff;color:#0d6875}.btn.danger{background:#fff0f0;color:#9c3131}.btn.small{padding:7px 10px;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.tab{border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:15px;padding:13px 7px;font-weight:900}.tab.active{background:#dff5f7;border-color:#74c7d1;color:#0b6976}
.section{display:none}.section.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);background-size:cover;background-position:center}.card h2,.card h3{margin-top:0}
.notice{background:#fff8e9;border:1px solid #efd5a4;color:#694814;border-radius:13px;padding:11px 13px;margin:11px 0}.muted{color:var(--muted)}
.item{background:rgba(251,254,255,.95);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.item-title{font-weight:900}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
label{display:block;font-size:13px;font-weight:800;margin-bottom:5px;color:#31525d}input,select,textarea{width:100%;border:1px solid #bad6dd;border-radius:11px;padding:9px 10px;background:#fbfeff;color:var(--ink)}
.scroll{overflow:auto}.records{width:100%;border-collapse:collapse;font-size:14px}.records th,.records td{padding:8px 6px;border-bottom:1px solid #e1edf0;text-align:left;white-space:nowrap}
.check-wrap{display:flex;gap:13px;align-items:flex-start}.char-icon{width:62px;height:62px;object-fit:contain;border-radius:15px;background:#eef8fa;border:1px solid var(--line);flex:0 0 auto}.question{padding:11px 0;border-top:1px solid #e1edf0}.question:first-child{border-top:0}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice label{font-weight:600;background:#eef7f9;border:1px solid #cce3e8;padding:7px 10px;border-radius:999px}.choice input{width:auto}
.result{margin-top:10px;padding:11px;border-radius:13px;background:#eef9fa;border:1px solid #c6e4e8}.hidden{display:none!important}.footer{text-align:center;color:#6b8189;font-size:12px;padding:24px 0 35px}
@media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.c6,.c4,.c3{grid-column:span 12}.wrap{padding:9px}.hero{border-radius:18px}.card{border-radius:16px;padding:13px}}
@media print{body{background:white!important}.no-print,.tabs{display:none!important}.section{display:block!important}.card{box-shadow:none;border:1px solid #bbb;background:white!important;break-inside:avoid}}

const PATIENT_KEY='marine_health_support_patient_v2';
let patient=load(PATIENT_KEY,{records:{},checks:{}});
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(f))}catch(e){return JSON.parse(JSON.stringify(f))}}
function savePatient(){localStorage.setItem(PATIENT_KEY,JSON.stringify(patient))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return 'p'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function localDT(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fmt(v){try{return new Date(v).toLocaleString('ja-JP')}catch(e){return v||''}}
function dl(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function switchTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}
function icon(id){return CONFIG.icons.find(x=>x.id===id)}
function bgStyle(key){const b=CONFIG.sectionBackgrounds?.[key];return b?.data?`style="background-image:linear-gradient(rgba(255,255,255,.90),rgba(255,255,255,.90)),url('${b.data}')"`:''}
function render(){
 document.title=CONFIG.title+' | MARINE TRICK';
 document.getElementById('title').textContent=CONFIG.title;document.getElementById('intro').textContent=CONFIG.intro;
 document.getElementById('updated').textContent=CONFIG.updatedAt?('最終更新: '+fmt(CONFIG.updatedAt)):'';
 if(CONFIG.background?.data)document.body.style.backgroundImage=`linear-gradient(rgba(237,248,250,.82),rgba(237,248,250,.82)),url("${CONFIG.background.data}")`;
 const login=document.getElementById('loginBtn'); if(CONFIG.loginButton?.enabled){login.classList.remove('hidden');login.href=CONFIG.loginButton.url||'#'}else login.classList.add('hidden');
 records.innerHTML=`<div class="card" ${bgStyle('records')}><h2>健康記録</h2><div class="notice">${esc(CONFIG.patientNotice)}</div>${CONFIG.recordTypes.filter(x=>x.enabled).map(recordBlock).join('')||'<p class="muted">公開中の記録項目はありません。</p>'}</div>`;
 sheets.innerHTML=`<div class="card" ${bgStyle('sheets')}><h2>サポートシート</h2><p class="muted">記録・確認・印刷に使えるシートです。</p>${CONFIG.sheets.filter(x=>x.enabled).map(s=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(s.title)}</div><div class="muted">${esc(s.description)}</div></div>${s.url?`<a class="btn primary" href="${esc(s.url)}" target="_blank" rel="noopener">開く / ダウンロード</a>`:'<span class="muted">準備中</span>'}</div></div>`).join('')||'<p class="muted">公開中のシートはありません。</p>'}</div>`;
 calc.innerHTML=`<div class="card" ${bgStyle('calc')}><h2>健康計算ツール</h2><div class="notice">計算結果は目安です。診断や治療判断の代わりにはなりません。</div>${calcBlocks()}</div>`;
 checks.innerHTML=`<div class="card" ${bgStyle('checks')}><h2>セルフチェック</h2><div class="notice">状態整理のための補助ツールです。診断を行うものではありません。</div>${CONFIG.checks.filter(x=>x.enabled).map(checkBlock).join('')||'<p class="muted">公開中のセルフチェックはありません。</p>'}</div>`;
 protectImages();
}
function recordBlock(rt){
 const arr=(patient.records[rt.id]||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
 return `<div class="item"><div class="item-head"><div class="item-title">${esc(rt.name)}</div><div class="muted">${arr.length}件</div></div><div class="row" style="margin-top:9px"><div class="c4"><label>日時</label><input id="at_${rt.id}" type="datetime-local" value="${localDT()}"></div>${rt.fields.map(f=>`<div class="c4"><label>${esc(f.label)}${f.unit?' ('+esc(f.unit)+')':''}</label><input id="f_${rt.id}_${f.key}" type="${f.type||'number'}" inputmode="${f.type==='number'?'decimal':'text'}"></div>`).join('')}</div><div style="margin-top:9px"><button class="btn primary" onclick="addRecord('${rt.id}')">記録する</button></div>${arr.length?`<div class="scroll" style="margin-top:10px"><table class="records"><thead><tr><th>日時</th>${rt.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>${arr.slice(0,40).map(r=>`<tr><td>${esc(fmt(r.at))}</td>${rt.fields.map(f=>`<td>${esc(r.values?.[f.key]??'')} ${esc(f.unit||'')}</td>`).join('')}<td><button class="btn small danger" onclick="delRecord('${rt.id}','${r.id}')">削除</button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`
}
function addRecord(id){const rt=CONFIG.recordTypes.find(x=>x.id===id);if(!rt)return;const values={};let ok=false;rt.fields.forEach(f=>{const v=document.getElementById(`f_${id}_${f.key}`).value.trim();values[f.key]=v;if(v)ok=true});if(!ok)return alert('少なくとも1項目入力してください。');patient.records[id]=patient.records[id]||[];patient.records[id].push({id:uid(),at:document.getElementById(`at_${id}`).value||new Date().toISOString(),values});savePatient();render()}
function delRecord(t,id){if(!confirm('この記録を削除しますか？'))return;patient.records[t]=(patient.records[t]||[]).filter(x=>x.id!==id);savePatient();render()}
function calcBlocks(){let h='';const c=CONFIG.calculators||{};if(c.bmi)h+=`<div class="item"><h3>BMI</h3><div class="row"><div class="c4"><label>身長(cm)</label><input id="bH" type="number"></div><div class="c4"><label>体重(kg)</label><input id="bW" type="number"></div><div class="c4"><label>結果</label><input id="bR" readonly></div></div><button class="btn primary" onclick="let h=+bH.value/100,w=+bW.value;bR.value=h>0&&w>0?(w/h/h).toFixed(1):''">計算</button></div>`;
 if(c.standardWeight)h+=`<div class="item"><h3>標準体重（BMI 22）</h3><div class="row"><div class="c6"><label>身長(cm)</label><input id="sH" type="number"></div><div class="c6"><label>標準体重(kg)</label><input id="sR" readonly></div></div><button class="btn primary" onclick="let h=+sH.value/100;sR.value=h>0?(22*h*h).toFixed(1):''">計算</button></div>`;
 if(c.crcl)h+=`<div class="item"><h3>クレアチニンクリアランス（Cockcroft-Gault）</h3><div class="row"><div class="c3"><label>年齢</label><input id="cA" type="number"></div><div class="c3"><label>体重(kg)</label><input id="cW" type="number"></div><div class="c3"><label>Scr(mg/dL)</label><input id="cS" type="number" step=".01"></div><div class="c3"><label>性別</label><select id="cX"><option value="m">男性</option><option value="f">女性</option></select></div></div><button class="btn primary" onclick="crcl()">計算</button><div id="cR" class="result hidden"></div></div>`;
 if(c.egfr)h+=`<div class="item"><h3>eGFR（日本人成人・血清Cr）</h3><div class="row"><div class="c4"><label>年齢</label><input id="eA" type="number"></div><div class="c4"><label>Scr(mg/dL)</label><input id="eS" type="number" step=".01"></div><div class="c4"><label>性別</label><select id="eX"><option value="m">男性</option><option value="f">女性</option></select></div></div><button class="btn primary" onclick="egfr()">計算</button><div id="eR" class="result hidden"></div></div>`;return h||'<p class="muted">公開中の計算ツールはありません。</p>'}
function crcl(){let a=+cA.value,w=+cW.value,s=+cS.value;if(!(a>0&&w>0&&s>0))return;let r=(140-a)*w/(72*s);if(cX.value==='f')r*=.85;cR.textContent='推算CrCl: '+r.toFixed(1)+' mL/min';cR.classList.remove('hidden')}
function egfr(){let a=+eA.value,s=+eS.value;if(!(a>0&&s>0))return;let r=194*Math.pow(s,-1.094)*Math.pow(a,-.287);if(eX.value==='f')r*=.739;eR.textContent='推算eGFR: '+r.toFixed(1)+' mL/min/1.73m²';eR.classList.remove('hidden')}
